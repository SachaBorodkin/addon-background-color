name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package for Chrome
        run: npm run zip

      - name: Build and package for Firefox
        run: npm run zip:firefox

      - name: Upload Chrome Artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-chrome
          path: .output/*-chrome.zip
          retention-days: 30

      - name: Upload Firefox Artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-firefox
          path: .output/*-firefox.zip
          retention-days: 30
