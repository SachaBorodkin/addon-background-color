name: Deploy Firefox Extension

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

jobs:
  deploy-firefox:
    name: Build & Sign Firefox Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension for Firefox
        run: npm run build:firefox

      - name: Sign with web-ext
        run: |
          npx web-ext sign \
            --api-key "${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret "${{ secrets.AMO_JWT_SECRET }}" \
            --channel unlisted \
            --source-dir .output/firefox-mv2 \
            --artifacts-dir ./signed

      - name: Upload Signed Firefox Artifact
        uses: actions/upload-artifact@v4
        with:
          name: addon-firefox-signed
          path: ./signed/*
          retention-days: 30
